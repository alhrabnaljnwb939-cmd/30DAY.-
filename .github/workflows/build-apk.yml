name: Build 30 DAY APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          unzip -q 30DAY-Project.zip -d proj
          echo "$KS_BASE64" | base64 -d > "$PWD/release.jks"
          export KS_PATH="$PWD/release.jks"
          cd proj/30DAY
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../30DAY.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" 30DAY.apk --title "30 DAY v${{ github.run_number }}" --notes "نسخة جاهزة للتثبيت"
